#
# Every operational value here is an environment variable with a development default.
# The defaults are what makes `mvn spring-boot:run` work against a local Postgres with
# no setup; deployment overrides them and never edits this file. Nothing that differs
# between a laptop and a production server is a literal below.
#
# The credential defaults are deliberately *not* removed to force an override. An
# unresolvable placeholder fails at context startup, which would break both local runs
# and the integration test. Enforcement belongs one layer out, where the deployment
# knows it is production: compose.yaml and the systemd env file both refuse to start
# without DB_PASSWORD set explicitly.
#
server:
  port: ${SERVER_PORT:8080}

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/serverregistry}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    # Must stay false: schema.sql has to run before Hibernate's ddl-auto=validate,
    # otherwise validation fails with "missing table [servers]" on an empty database.
    defer-datasource-initialization: false
    # Nothing is lazy-loaded and the controller maps to records before serialising, so a
    # request-scoped session buys nothing. Off explicitly, rather than left to the default.
    open-in-view: false

logging:
  level:
    root: ${LOG_LEVEL:INFO}

healthcheck:
  timeout-ms: ${HEALTHCHECK_TIMEOUT_MS:3000}
